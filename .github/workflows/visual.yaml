name: Visual

on:
  push:
    branches: [simplex]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Write the screenshots that differ as the new baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-jammy@sha256:8845c40cdade98fd7a6cd32df75bfc234cd52b3278f9cd1f9fe8d6291e48ea03
    env:
      NEXT_PUBLIC_CHAIN_NAME: mainnet
      NEXT_PUBLIC_MAINNET_RPC_URL: http://127.0.0.1:8545
      NEXT_PUBLIC_SIMPLEX_TLD: simplex
      E2E_PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the checkout, owned by another user than the container's
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v3
        with:
          version: '10.23.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install the dependencies as the Pages deploy does
        run: pnpm install --no-frozen-lockfile --prefer-frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
          cache: false

      - name: Export the dApp as the Pages deploy does, with the addresses and node of the local chain
        run: |
          export NEXT_PUBLIC_MAINNET_DEPLOYMENT_ADDRESSES="$(cat e2e/visual/chain/addresses.json)"
          pnpm build
          pnpm export

      - name: Compare the screens with the baselines
        run: pnpm exec playwright test -c e2e/visual/playwright.config.ts --project=${{ matrix.project }} ${{ inputs.update && '--update-snapshots' || '' }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.project }}
          path: |
            test-results/visual
            playwright-report/visual
          retention-days: 14

      - if: inputs.update || failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.project }}
          path: |
            e2e/visual/screenshots/${{ matrix.project }}
            e2e/visual/screenshots/registration.spec.ts
          retention-days: 14
